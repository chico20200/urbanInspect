<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <img class="logo-toolbar" src="assets/logo.svg" alt="" />
    </ion-buttons>
    <ion-title>UrbanInspect</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="elegirTema()" aria-label="Cambiar apariencia">
        <ion-icon slot="icon-only" [name]="iconoTema()"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="portada">
    <img src="assets/logo.svg" alt="Logo de UrbanInspect" />
    <div>
      <h1>UrbanInspect</h1>
      <p>Inspección de infraestructura urbana · Quito</p>
    </div>
  </div>
